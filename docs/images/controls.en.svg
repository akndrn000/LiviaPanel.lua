="#464b64" /><text x="1176.0" y="147" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" >OFF</text><text x="980.0" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="900" fill="#f0f2fa" text-anchor="start" >Close (X)</text><text x="980.0" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >Turns every feature off,</text><text x="980.0" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >then closes the panel.</text>
