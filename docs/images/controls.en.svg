a Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >Buttons react when you tap</text><text x="44.0" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >without moving your finger.</text><rect x="343.0" y="37" width="296" height="282" rx="14" fill="#07080f" opacity="0.55"/><rect x="336.0" y="30" width="296" height="282" rx="14" fill="#202332" stroke="#000" stroke-width="2" stroke-opacity="0.35"/><rect x="350.0" y="44" width="268" height="140" rx="10" fill="#101118" stroke="#3a3f5a" stroke-width="1" /><rect x="386.0" y="80" width="64" height="56" rx="8" fill="none" stroke="#8a90b8" stroke-width="2" stroke-dasharray="6 5"/><rect x="512.0" y="96" width="64" height="56" rx="8" fill="#181a25" stroke="#7c5cff" stroke-width="2" /><rect x="512.0" y="96" width="64" height="12" rx="6" fill="#7c5cff" /><path d="M458.0 108 H500.0 m-9 -9 l9 9 l-9 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="square"/><text x="479.0" y="92" font-family="Consolas,'SFMono-Regular',Menlo,'DejaVu Sans Mono',monospace" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >&gt; 10 px</text><text x="356.0" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="900" fill="#f0f2fa" text-anchor="start" >Drag</text><text x="356.0" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >Moving more than 10 px</text><text x="356.0" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >drags the panel. Buttons</text><text x="356.0" y="298" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >stay inactive while dragging.</text><rect x="655.0" y="37" width="296" height="282" rx="14" fill="#07080f" opacity="0.55"/><rect x="648.0" y="30" width="296" height="282" rx="14" fill="#202332" stroke="#000" stroke-width="2" stroke-opacity="0.35"/><rect x="662.0" y="44" width="268" height="140" rx="10" fill="#101118" stroke="#3a3f5a" stroke-width="1" /><rect x="696.0" y="96" width="112" height="36" rx="8" fill="#181a25" stroke="#3a3f5a" stroke-width="1" /><rect x="744.0" y="102" width="24" height="24" rx="6" fill="#7c5cff" /><text x="756.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >-</text><rect x="772.0" y="102" width="24" height="24" rx="6" fill="#f05460" /><text x="784.0" y="119" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >X</text><path d="M816.0 114 h24 m-9 -9 l9 9 l-9 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="square"/><g transform="translate(874.0,114) scale(0.9)"><circle cx="4" cy="5" r="26" fill="#07080f" opacity="0.6"/><circle r="26" fill="#7c5cff" stroke="#000" stroke-opacity="0.3" stroke-width="2"/><text x="0" y="9" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#f0f2fa" text-anchor="middle" >L</text></g><text x="668.0" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="900" fill="#f0f2fa" text-anchor="start" >Minimize (-)</text><text x="668.0" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >The panel becomes an L</text><text x="668.0" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >bubble. Tap the bubble to</text><text x="668.0" y="298" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#e3e6fb" text-anchor="start" >open it again.<